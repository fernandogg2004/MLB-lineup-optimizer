# Optional local Airflow stack (LocalExecutor + PostgreSQL). Not started by anything
# in this repository; services do not auto-restart. See orchestration/airflow/README.md.
x-airflow-common: &airflow-common
  build: { context: ., dockerfile: Dockerfile.airflow }
  image: batting-order-airflow:2.10.5
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - /var/run/docker.sock:/var/run/docker.sock
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres: { condition: service_healthy }

services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: airflow, POSTGRES_PASSWORD: airflow, POSTGRES_DB: airflow }
    volumes: [postgres-db:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "airflow"], interval: 10s, retries: 5 }
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command: ["-c", "airflow db migrate && airflow users create --role Admin --username \"$${_AIRFLOW_WWW_USER_USERNAME}\" --password \"$${_AIRFLOW_WWW_USER_PASSWORD}\" --email admin@example.com --firstname a --lastname a || true"]
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports: ["127.0.0.1:8080:8080"]
    depends_on: { airflow-init: { condition: service_completed_successfully } }
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on: { airflow-init: { condition: service_completed_successfully } }

volumes:
  postgres-db:
